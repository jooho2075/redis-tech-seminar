spring:
  application:
    name: redis-architecture

  datasource:
    # 파일 기반 DB 설정 (빨간 줄 방지를 위해 경로 확인)
    url: jdbc:h2:file:./data/ticketing;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true

  h2:
    console:
      enabled: true
      path: /h2-console